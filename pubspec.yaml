name: docs_grid
description: Offline-first personal document organiser for Android and iPhone.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.3.2
  crypto: ^3.0.7
  uuid: ^4.6.0
  intl: ^0.20.3
  open_filex: ^4.7.0
  archive: ^4.0.7
  image_picker: ^1.2.0
  pdf: ^3.11.3
  pdfx: ^2.9.2
  google_mlkit_text_recognition: ^0.15.0
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
