name: Flutter CI

concurrency:
  group: docsgrid-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feature/complete-ten-features, fix/crop-ocr-performance]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android analyze, test and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform scaffolding
        run: flutter create --platforms=android,ios --org com.docsgrid .
      - name: Use non-conflicting DocsGrid Android package ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file was not generated')
          source = gradle.read_text()
          if gradle.suffix == '.kts':
              source, count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.docsgrid.mobile"', source, count=1)
          else:
              source, count = re.subn(r'applicationId\s+"[^"]+"', 'applicationId "com.docsgrid.mobile"', source, count=1)
          if count != 1:
              raise SystemExit('Could not set stable DocsGrid applicationId')
          gradle.write_text(source)
          print('Android applicationId: com.docsgrid.mobile')
          PY
      - name: Set DocsGrid app display name on Android and iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          android = Path('android/app/src/main/AndroidManifest.xml')
          text = android.read_text()
          text, count = re.subn(r'<application([^>]*?)android:label="[^"]*"',
                                r'<application\1android:label="DocsGrid"', text, count=1)
          if count != 1:
              raise SystemExit('Could not set Android application label')
          android.write_text(text)
          ios = Path('ios/Runner/Info.plist')
          text = ios.read_text()
          if '<key>CFBundleDisplayName</key>' in text:
              text = re.sub(r'<key>CFBundleDisplayName</key>\s*<string>.*?</string>',
                            '<key>CFBundleDisplayName</key>\n\t<string>DocsGrid</string>', text, count=1, flags=re.S)
          else:
              text = text.replace('</dict>', '<key>CFBundleDisplayName</key>\n\t<string>DocsGrid</string>\n</dict>', 1)
          ios.write_text(text)
          PY
      - name: Set Android compile SDK for image cropper dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Flutter did not generate android/app/build.gradle(.kts)')
          s = gradle.read_text()
          if gradle.suffix == '.kts':
              s, count = re.subn(r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|[0-9]+)', 'compileSdk = 36', s, count=1)
          else:
              s, count = re.subn(r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|[0-9]+)', 'compileSdkVersion 36', s, count=1)
          if count != 1:
              raise SystemExit(f'Could not locate compileSdk declaration in {gradle}')
          gradle.write_text(s)
          print(f'Configured app compileSdk 36 in {gradle}')
          PY
      - name: Enable Android core library desugaring for scheduled notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Flutter did not generate android/app/build.gradle(.kts)')
          s = gradle.read_text()
          if gradle.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s, count = re.subn(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
                  if count != 1:
                      raise SystemExit('Could not locate Android compileOptions block')
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if 'coreLibraryDesugaringEnabled' not in s:
                  s, count = re.subn(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', s, count=1)
                  if count != 1:
                      raise SystemExit('Could not locate Android compileOptions block')
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dependency not in s:
              match = re.search(r'dependencies\s*\{', s)
              if match:
                  s = s[:match.end()] + '\n    ' + dependency + s[match.end():]
              else:
                  s += '\ndependencies {\n    ' + dependency + '\n}\n'
          gradle.write_text(s)
          print(f'Enabled core library desugaring in {gradle}')
          PY
      - name: Bundle Android Devanagari OCR model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file was not generated')
          source = gradle.read_text()
          if 'text-recognition-devanagari' not in source:
              if gradle.suffix == '.kts':
                  dependency = 'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")'
              else:
                  dependency = "implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'"
              marker = 'dependencies {'
              if marker not in source:
                  raise SystemExit('Could not find Android dependencies block')
              source = source.replace(marker, marker + '\\n    ' + dependency, 1)
              gradle.write_text(source)
          print('Bundled Android Devanagari OCR model')
          PY
      - name: Configure Android camera and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<application'
          permissions = '    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    '
          s = s.replace(marker, permissions + marker, 1)
          receivers = '''\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n    <receiver android:enabled="true" android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n        <intent-filter>\n            <action android:name="android.intent.action.BOOT_COMPLETED"/>\n            <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n            <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n        </intent-filter>\n    </receiver>\n    '''
          # Make DocsGrid appear in Android's Share sheet for PDF attachments.
          # The incoming URI is granted by the sending app; users can then
          # choose DocsGrid and import the shared PDF from the picker.
          if 'android.intent.action.SEND' not in s:
              share_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <data android:mimeType="application/pdf"/>
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <data android:mimeType="application/pdf"/>
                  </intent-filter>
              '''
              s = s.replace('</activity>', share_filter + '\n            </activity>', 1)
          p.write_text(s)
          PY
      - name: Install Android SAF host integration
        if: runner.os == 'Linux'
        run: |
          mkdir -p android/app/src/main/kotlin/com/docsgrid/docs_grid
          cp platform/android/MainActivity.kt android/app/src/main/kotlin/com/docsgrid/docs_grid/MainActivity.kt
      - name: Install packages
        run: flutter pub get
      - name: Generate DocsGrid launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/docsgrid_icon.svg -o assets/docsgrid_icon.png
          dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Widget and unit tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: docsgrid-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS analyze, test and unsigned build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform scaffolding
        run: flutter create --platforms=android,ios --org com.docsgrid .
      - name: Configure iOS camera and photo usage descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner/Info.plist')
          s = p.read_text()
          keys = '''\n          <key>NSCameraUsageDescription</key>\n          <string>DocsGrid uses the camera to scan document pages into PDFs.</string>\n          <key>NSPhotoLibraryUsageDescription</key>\n          <string>DocsGrid uses selected photos to create PDF documents.</string>\n          '''
          s = s.replace('</dict>', keys + '\n</dict>', 1)
          p.write_text(s)
          PY
      - name: Install iOS Files host integration
        run: cp platform/ios/AppDelegate.swift ios/Runner/AppDelegate.swift
      - name: Set iOS deployment target for on-device ML Kit
        run: |
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.5'/" ios/Podfile
      - name: Install packages
        run: flutter pub get
      - name: Generate DocsGrid launcher icons
        run: |
          brew install librsvg
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/docsgrid_icon.svg -o assets/docsgrid_icon.png
          dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Widget and unit tests
        run: flutter test
      - name: Build iOS without code signing
        run: flutter build ios --no-codesign
