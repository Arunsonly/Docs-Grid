name: Flutter CI

concurrency:
  group: docsgrid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feature/complete-ten-features, fix/crop-ocr-performance, feature/docsgrid-document-engine-upgrade, feature/docsgrid-completion-pr19, fix/grid-ui-selection-search-import]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android analyze, test and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Generate native platform scaffolding
        run: flutter create --no-pub --platforms=android,ios --org com.docsgrid .
      - name: Configure verified Kotlin compiler mirror
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          MIRROR='https://repo.maven.apache.org/maven2/'
          ARTIFACT='org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.21/kotlin-compiler-embeddable-2.2.21.jar'
          EXPECTED='9588fa696ac5507af764fd5660df6894185e12704ec1bc3f5cb772af4987f295'
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors "$MIRROR$ARTIFACT" -o /tmp/kotlin-compiler-embeddable-2.2.21.jar
          echo "$EXPECTED  /tmp/kotlin-compiler-embeddable-2.2.21.jar" | sha256sum --check --status
          echo 'Kotlin 2.2.21 compiler artifact mirror and SHA-256 verified.'
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/docsgrid-kotlin-mirror.gradle" <<'GRADLE'
          def addKotlinMirror = { repositories ->
            if (!repositories.find { it.name == 'docsGridVerifiedKotlinMirror' }) {
              repositories.maven {
                name = 'docsGridVerifiedKotlinMirror'
                url = uri('https://repo.maven.apache.org/maven2/')
                content { includeGroupByRegex('org\\.jetbrains\\.kotlin(\\..*)?') }
              }
            }
          }
          gradle.beforeSettings { settings ->
            // The mirror is only a fallback for Kotlin artifacts. Flutter's
            // Gradle plugin marker (org.gradle.kotlin.kotlin-dsl) is published
            // through the Gradle Plugin Portal, not the WSO2 Maven mirror.
            settings.pluginManagement.repositories {
              gradlePluginPortal()
              google()
              mavenCentral()
            }
            settings.dependencyResolutionManagement.repositories {
              google()
              mavenCentral()
            }
            addKotlinMirror(settings.pluginManagement.repositories)
            addKotlinMirror(settings.dependencyResolutionManagement.repositories)
          }
          GRADLE
      - name: Route Gradle distribution through the official direct download host
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          if not wrapper.exists():
              raise SystemExit('Gradle wrapper properties were not generated')
          content = wrapper.read_text()
          match = re.search(r'(?m)^distributionUrl=(.+)$', content)
          if not match:
              raise SystemExit('Gradle distributionUrl is missing')
          url = match.group(1).replace(r'\:', ':')
          filename = url.rsplit('/', 1)[-1]
          if (not filename.startswith('gradle-') or not filename.endswith('.zip') or
                  '/' in filename or '\\' in filename):
              raise SystemExit('Unexpected Gradle distribution filename: ' + filename)
          direct_url = r'https\://downloads.gradle.org/distributions/' + filename
          content = content[:match.start(1)] + direct_url + content[match.end(1):]
          wrapper.write_text(content)
          print('Using official direct Gradle distribution: ' + direct_url)
          PY
      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-9.3.1
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Use non-conflicting DocsGrid Android package ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file was not generated')
          source = gradle.read_text()
          if gradle.suffix == '.kts':
              source, count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.docsgrid.mobile"', source, count=1)
          else:
              source, count = re.subn(r'applicationId\s+"[^"]+"', 'applicationId "com.docsgrid.mobile"', source, count=1)
          if count != 1:
              raise SystemExit('Could not set stable DocsGrid applicationId')
          gradle.write_text(source)
          print('Android applicationId: com.docsgrid.mobile')
          PY
      - name: Set DocsGrid app display name on Android and iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          android = Path('android/app/src/main/AndroidManifest.xml')
          text = android.read_text()
          text, count = re.subn(r'<application([^>]*?)android:label="[^"]*"',
                                r'<application\1android:label="DocsGrid"', text, count=1)
          if count != 1:
              raise SystemExit('Could not set Android application label')
          android.write_text(text)
          ios = Path('ios/Runner/Info.plist')
          text = ios.read_text()
          if '<key>CFBundleDisplayName</key>' in text:
              text = re.sub(r'<key>CFBundleDisplayName</key>\s*<string>.*?</string>',
                            '<key>CFBundleDisplayName</key>\n\t<string>DocsGrid</string>', text, count=1, flags=re.S)
          else:
              text = text.replace('</dict>', '<key>CFBundleDisplayName</key>\n\t<string>DocsGrid</string>\n</dict>', 1)
          ios.write_text(text)
          PY
      - name: Set Android compile SDK for image cropper dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Flutter did not generate android/app/build.gradle(.kts)')
          s = gradle.read_text()
          if gradle.suffix == '.kts':
              s, count = re.subn(r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|[0-9]+)', 'compileSdk = 36', s, count=1)
          else:
              s, count = re.subn(r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|[0-9]+)', 'compileSdkVersion 36', s, count=1)
          if count != 1:
              raise SystemExit(f'Could not locate compileSdk declaration in {gradle}')
          gradle.write_text(s)
          print(f'Configured app compileSdk 36 in {gradle}')
          PY
      - name: Enable Android core library desugaring for scheduled notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Flutter did not generate android/app/build.gradle(.kts)')
          s = gradle.read_text()
          if gradle.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s, count = re.subn(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
                  if count != 1:
                      raise SystemExit('Could not locate Android compileOptions block')
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if 'coreLibraryDesugaringEnabled' not in s:
                  s, count = re.subn(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', s, count=1)
                  if count != 1:
                      raise SystemExit('Could not locate Android compileOptions block')
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dependency not in s:
              match = re.search(r'dependencies\s*\{', s)
              if match:
                  s = s[:match.end()] + '\n    ' + dependency + s[match.end():]
              else:
                  s += '\ndependencies {\n    ' + dependency + '\n}\n'
          gradle.write_text(s)
          print(f'Enabled core library desugaring in {gradle}')
          PY
      - name: Include the Devanagari OCR engine used by DocsGrid in Release builds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit('Generated Android app Gradle file is missing')
          source = gradle.read_text()
          # DocsGrid requests TextRecognitionScript.devanagiri at runtime.
          # Unlike unused optional scripts, this ML Kit package must be
          # installed, not silenced via -dontwarn.
          if gradle.suffix == '.kts':
              dependency = 'implementation("com.google.mlkit:text-recognition-devanagari:16.0.0")'
              proguard = 'proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
          else:
              dependency = "implementation 'com.google.mlkit:text-recognition-devanagari:16.0.0'"
              proguard = "proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
          if dependency not in source:
              match = re.search(r'dependencies\s*\{', source)
              if match:
                  source = source[:match.end()] + '\n    ' + dependency + source[match.end():]
              else:
                  source += '\ndependencies {\n    ' + dependency + '\n}\n'
          source, count = re.subn(
              r'(release\s*\{)',
              lambda match: match.group(1) + '\n            ' + proguard,
              source, count=1,
          )
          if count != 1:
              raise SystemExit('Could not find the release build type')
          gradle.write_text(source)
          rules = Path('android/app/proguard-rules.pro')
          rules.write_text('''# Optional ML Kit scripts never invoked by DocsGrid.
          # DO NOT silence Devanagari: DocsGrid uses it for Hindi OCR.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          ''')
          print('Preserved Devanagari OCR dependency; scoped optional R8 rules.')
          PY
      - name: Configure Android camera and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<application'
          permissions = '    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    '
          s = s.replace(marker, permissions + marker, 1)
          receivers = '''\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n    <receiver android:enabled="true" android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n        <intent-filter>\n            <action android:name="android.intent.action.BOOT_COMPLETED"/>\n            <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n            <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n        </intent-filter>\n    </receiver>\n    '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receivers + '\n</application>', 1)
          # Make DocsGrid appear in Android's Share sheet for PDF attachments.
          # The incoming URI is granted by the sending app; users can then
          # choose DocsGrid and import the shared PDF from the picker.
          if 'android.intent.action.SEND' not in s:
              share_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <data android:mimeType="application/pdf"/>
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <data android:mimeType="application/pdf"/>
                  </intent-filter>
              '''
              s = s.replace('</activity>', share_filter + '\n            </activity>', 1)
          # Share only this explicitly scoped cache directory with chosen
          # Android PDF readers. Never publish the whole app cache.
          provider = '''
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.docsgrid_grid_pdf"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/docsgrid_grid_pdf_paths" />
              </provider>
          '''
          if 'docsgrid_grid_pdf_paths' not in s:
              s = s.replace('</application>', provider + '\n</application>', 1)
          p.write_text(s)
          paths = Path('android/app/src/main/res/xml/docsgrid_grid_pdf_paths.xml')
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="grid_pdf" path="docsgrid_grid_pdf/" />
          </paths>
          ''')
          PY
      - name: Install Android SAF host integration
        if: runner.os == 'Linux'
        run: |
          mkdir -p android/app/src/main/kotlin/com/docsgrid/docs_grid
          cp platform/android/MainActivity.kt android/app/src/main/kotlin/com/docsgrid/docs_grid/MainActivity.kt
      - name: Install packages
        run: flutter pub get
      - name: Verify checked-in DocsGrid launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path('assets/docsgrid_icon.png').read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'Launcher PNG signature invalid'
          assert struct.unpack('>II', data[16:24]) == (1024, 1024), 'Launcher PNG must be 1024x1024'
          print('Using the original pre-rendered DocsGrid icon from this commit.')
          PY
      - name: Generate DocsGrid launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Ensure system SQLite for FFI tests
        if: runner.os == 'Linux'
        run: |
          if dpkg-query -W -f='${Status}' libsqlite3-dev 2>/dev/null | grep -q 'install ok installed'; then
            echo 'libsqlite3-dev is already installed on the hosted runner.'
          else
            sudo apt-get install -y libsqlite3-dev
          fi
      - name: Widget and unit tests
        run: flutter test
      - name: End-to-end integration workflow tests
        run: flutter test test/integration --reporter expanded
      - name: Performance benchmark (10k documents)
        run: flutter test test/performance --reporter expanded
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle distribution/build attempt $attempt failed; retrying after backoff."
              sleep $((attempt * 20))
            fi
          done
          exit 1
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: docsgrid-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # Same Flutter source, same generated AndroidManifest, same launcher
      # icon and applicationId as the debug build above. Flutter's generated
      # Android scaffolding uses the debug keystore for internal release
      # evaluation unless a genuine production signing key is configured.
      - name: Build internal performance-evaluation Release APK
        run: |
          set -euo pipefail
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Validate Release APK integrity, identity and signing
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -tq "$APK" >/dev/null
          AAPT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > /tmp/docsgrid-release-badging.txt
          grep -F "package: name='com.docsgrid.mobile'" /tmp/docsgrid-release-badging.txt
          grep -F "launchable-activity: name='com.docsgrid.docs_grid.MainActivity'" /tmp/docsgrid-release-badging.txt
          echo "DocsGrid icon source:"
          sha256sum assets/docsgrid_icon.png
          echo "Release APK checksum and size:"
          sha256sum "$APK"
          wc -c "$APK"
          echo "Internal performance-evaluation build only; DO NOT publish to Play."
      - name: Upload verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: docsgrid-android-release-evaluation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14


  android_release_startup:
    name: Release APK process-cold launch benchmark (Android emulator)
    needs: android
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # GitHub-hosted Linux x86_64 runners expose KVM for accelerated Android tests.
    # Avoid macOS ARM nested-HVF restrictions and slow Intel macOS emulation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Release APK from this exact run
        uses: actions/download-artifact@v4
        with:
          name: docsgrid-android-release-evaluation-apk
          path: artifacts/release
      - name: Verify TTID parser and percentile calculations
        run: python3 -m unittest discover -s scripts -p 'test_android_cold_launch.py' -v
      - name: Enable hardware-accelerated Android virtualization
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          # Hosted runner images do not always run a persistent udev daemon.
          # These two commands may fail even when /dev/kvm exists and is usable.
          sudo udevadm control --reload-rules || echo 'udev reload unavailable; checking device directly'
          sudo udevadm trigger --name-match=kvm || echo 'udev trigger unavailable; checking device directly'
          if ! test -c /dev/kvm; then
            echo '::error::This Linux runner does not expose /dev/kvm; emulator benchmark cannot run.'
            ls -l /dev/kvm || true
            exit 1
          fi
          # Same effective permission as the udev rule, on this disposable CI VM.
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            echo '::error::KVM exists, but the CI runner cannot read/write it.'
            exit 1
          fi
      - name: Confirm emulator host and APK ABI compatibility
        run: |
          set -euo pipefail
          echo "Linux host architecture: $(uname -m)"
          test "$(uname -m)" = x86_64
          unzip -Z1 artifacts/release/app-release.apk | grep -Fx 'lib/x86_64/libflutter.so'
      - name: Measure Release APK cold launches (TTID, not TTFD)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          # Match the x86_64 Linux KVM runner.
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: >-
            python3 scripts/benchmark_android_cold_launch.py
            --apk artifacts/release/app-release.apk
            --output startup-results/cold-launch.json
            --iterations 7 --warmups 1
      - name: Upload startup timing baseline and sample data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docsgrid-android-cold-launch-baseline
          path: startup-results/cold-launch.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS analyze, test and unsigned build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Generate native platform scaffolding
        run: flutter create --no-pub --platforms=android,ios --org com.docsgrid .
      - name: Configure iOS camera and photo usage descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner/Info.plist')
          s = p.read_text()
          keys = '''\n          <key>NSCameraUsageDescription</key>\n          <string>DocsGrid uses the camera to scan document pages into PDFs.</string>\n          <key>NSPhotoLibraryUsageDescription</key>\n          <string>DocsGrid uses selected photos to create PDF documents.</string>\n          '''
          s = s.replace('</dict>', keys + '\n</dict>', 1)
          if '<key>CFBundleDocumentTypes</key>' not in s:
              document_types = '''
              <key>CFBundleDocumentTypes</key>
              <array>
                <dict>
                  <key>CFBundleTypeName</key>
                  <string>PDF Document</string>
                  <key>CFBundleTypeRole</key>
                  <string>Viewer</string>
                  <key>LSHandlerRank</key>
                  <string>Alternate</string>
                  <key>LSItemContentTypes</key>
                  <array>
                    <string>com.adobe.pdf</string>
                  </array>
                </dict>
              </array>
              '''
              s = s.replace('</dict>', document_types + '\n</dict>', 1)
          p.write_text(s)
          PY
      - name: Install iOS Files host integration
        run: cp platform/ios/AppDelegate.swift ios/Runner/AppDelegate.swift
      - name: Set iOS deployment target for on-device ML Kit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          if not project.exists():
              raise SystemExit('Generated iOS Xcode project is missing')
          content = project.read_text()
          content, count = re.subn(
              r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 15.5;',
              content,
          )
          if count == 0:
              raise SystemExit('Could not set iOS deployment target in Xcode project')
          project.write_text(content)
          podfile = Path('ios/Podfile')
          if podfile.exists():
              content = podfile.read_text()
              content, count = re.subn(
                  r"platform :ios, '[0-9.]+'",
                  "platform :ios, '15.5'",
                  content,
                  count=1,
              )
              if count:
                  podfile.write_text(content)
          else:
              print('No CocoaPods Podfile generated; Flutter plugin tooling will manage iOS dependencies.')
          PY
      - name: Install packages
        run: flutter pub get
      - name: Verify checked-in DocsGrid launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path('assets/docsgrid_icon.png').read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'Launcher PNG signature invalid'
          assert struct.unpack('>II', data[16:24]) == (1024, 1024), 'Launcher PNG must be 1024x1024'
          print('Using the original pre-rendered DocsGrid icon from this commit.')
          PY
      - name: Generate DocsGrid launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Widget and unit tests
        run: flutter test
      - name: End-to-end integration workflow tests
        run: flutter test test/integration --reporter expanded
      - name: Performance benchmark (10k documents)
        run: flutter test test/performance --reporter expanded
      - name: Build iOS without code signing
        run: flutter build ios --no-codesign
