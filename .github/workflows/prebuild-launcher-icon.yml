name: Seed existing DocsGrid launcher PNG

on:
  push:
    branches: [ci/prebuilt-launcher-icon-20261116]

permissions:
  contents: write

jobs:
  commit_launcher_png:
    name: Render and commit checked-in PNG from existing SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render current icon without redesign
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          test -s assets/docsgrid_icon.svg
          rsvg-convert -w 1024 -h 1024 assets/docsgrid_icon.svg -o assets/docsgrid_icon.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('assets/docsgrid_icon.png')
          data = p.read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n')
          assert struct.unpack('>II', data[16:24]) == (1024, 1024)
          print(f'Original DocsGrid icon rendered as PNG: {len(data)} bytes')
          PY
      - name: Commit generated PNG in this feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docsgrid_icon.png
          if git diff --cached --quiet; then
            echo "The PNG is already committed."
            exit 0
          fi
          git commit -m "Store launcher PNG rendered from existing DocsGrid SVG"
          git push origin "HEAD:$GITHUB_REF_NAME"
